[package]
name = "quanta-note"
version = "0.4.0"
description = "Local-first desktop information hub"
authors = ["QuantaNote"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quanta_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.0", features = [] }

[dependencies]
tauri = { version = "=2.11.0", features = ["protocol-asset"] }
tauri-plugin-opener = "=2.5.4"
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-log = "=2.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.35", features = ["bundled", "trace"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
log = "0.4"
zip = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
sha2 = "0.10"
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native", "apple-native", "sync-secret-service"] }
zeroize = "1"
tokio = { version = "1", features = ["time", "macros"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri = { version = "=2.11.0", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-updater = "=2.10.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }
