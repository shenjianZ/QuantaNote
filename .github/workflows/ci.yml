name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart("v")
          if ($tagVersion -notmatch '^\d+\.\d+\.\d+(-[\w.]+)?$') {
            throw "Release tag must contain a valid semver version: $($env:GITHUB_REF_NAME)"
          }

          $jsonFiles = @("package.json", "site/package.json", "docs/package.json", "src-tauri/tauri.conf.json")
          foreach ($file in $jsonFiles) {
            $version = (Get-Content $file -Raw | ConvertFrom-Json).version
            if ($version -ne $tagVersion) { throw "$file version $version != tag $tagVersion" }
          }

          $textVersions = @{
            "src-tauri/Cargo.toml" = '^version = "([^\"]+)"$'
            "quantanote-cloud/Cargo.toml" = '^version = "([^\"]+)"$'
            "quantanote-cloud/src/cli.rs" = '#\[command\(version = "([^\"]+)"\)\]'
            "quantanote-cloud/src/handlers/health.rs" = '"version": "([^\"]+)"'
          }
          foreach ($entry in $textVersions.GetEnumerator()) {
            $match = Select-String -Path $entry.Key -Pattern $entry.Value | Select-Object -First 1
            if ($null -eq $match) { throw "Could not read version from $($entry.Key)" }
            $version = $match.Matches[0].Groups[1].Value
            if ($version -ne $tagVersion) { throw "$($entry.Key) version $version != tag $tagVersion" }
          }

          foreach ($file in @("docs/public/config/site.yaml", "docs/public/config/site.en.yaml")) {
            $content = Get-Content $file -Raw
            if ($content -notmatch "version: \"v$([regex]::Escape($tagVersion))\"") {
              throw "$file footer version does not match v$tagVersion"
            }
          }

          foreach ($file in @("site/src/components/Hero.tsx", "site/src/components/DownloadCTA.tsx")) {
            $content = Get-Content $file -Raw
            if ($content -notmatch "v$([regex]::Escape($tagVersion))") {
              throw "$file does not contain v$tagVersion"
            }
          }

          $changelog = Get-Content CHANGELOG.md -Raw
          if ($changelog -notmatch "(?m)^## \[$([regex]::Escape($tagVersion))\] - \d{4}-\d{2}-\d{2}") {
            throw "CHANGELOG.md has no dated section for $tagVersion"
          }

      - name: Check bilingual documentation
        run: node scripts/check-docs.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install documentation dependencies
        run: pnpm --dir docs install --frozen-lockfile

      - name: Build documentation site
        run: pnpm docs:build

      - name: Validate release Secrets
        env:
          QUANTANOTE_TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.QUANTANOTE_TAURI_UPDATER_PUBLIC_KEY }}
          QUANTANOTE_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.QUANTANOTE_TAURI_SIGNING_PRIVATE_KEY }}
          QUANTANOTE_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.QUANTANOTE_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
          ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            QUANTANOTE_TAURI_UPDATER_PUBLIC_KEY
            QUANTANOTE_TAURI_SIGNING_PRIVATE_KEY
            QUANTANOTE_TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
            ALIYUN_REGISTRY
            ALIYUN_NAME_SPACE
            ALIYUN_REGISTRY_USER
            ALIYUN_REGISTRY_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required release secret: $name" >&2
              exit 1
            fi
          done

  create-release:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      body: ${{ steps.changelog.outputs.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # 提取对应版本的 changelog 内容
          BODY=$(sed -n "/^## \[${TAG#v}\]/,/^## \[/p" CHANGELOG.md | sed '$d' | tail -n +2)
          if [ -z "$BODY" ]; then
            BODY="Release ${TAG}"
          fi
          # 读取安装指南文件并替换版本号
          if [ -f "RELEASE_GUIDE.md" ]; then
            GUIDE=$(sed "s/__TAG__/${TAG}/g" RELEASE_GUIDE.md)
            BODY="${BODY}"$'\n\n'"${GUIDE}"
          fi
          # 多行内容需要特殊处理
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "QuantaNote ${{ github.ref_name }}"
          body: ${{ steps.changelog.outputs.body }}
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact_name: windows-x64
            args: ""
            rust_target: ""
          - platform: ubuntu-latest
            artifact_name: linux-x64
            args: ""
            rust_target: ""
          - platform: macos-latest
            artifact_name: macos-aarch64
            args: "--target aarch64-apple-darwin"
            rust_target: "aarch64-apple-darwin"
          - platform: macos-latest
            artifact_name: macos-x64
            args: "--target x86_64-apple-darwin"
            rust_target: "x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart("v")
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $siteVersion = (Get-Content site/package.json -Raw | ConvertFrom-Json).version
          $docsVersion = (Get-Content docs/package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$').Matches[0].Groups[1].Value
          if ($packageVersion -ne $tagVersion) { throw "package.json version $packageVersion != tag $tagVersion" }
          if ($siteVersion -ne $tagVersion) { throw "site/package.json version $siteVersion != tag $tagVersion" }
          if ($docsVersion -ne $tagVersion) { throw "docs/package.json version $docsVersion != tag $tagVersion" }
          if ($tauriVersion -ne $tagVersion) { throw "tauri.conf.json version $tauriVersion != tag $tagVersion" }
          if ($cargoVersion -ne $tagVersion) { throw "Cargo.toml version $cargoVersion != tag $tagVersion" }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Inject updater public key
        shell: pwsh
        env:
          QUANTANOTE_TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.QUANTANOTE_TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:QUANTANOTE_TAURI_UPDATER_PUBLIC_KEY)) {
            throw "QUANTANOTE_TAURI_UPDATER_PUBLIC_KEY is required for a release build"
          } else {
            $path = "src-tauri/tauri.conf.json"
            $content = Get-Content $path -Raw
            $content = $content.Replace(
              "__QUANTANOTE_TAURI_UPDATER_PUBLIC_KEY__",
              $env:QUANTANOTE_TAURI_UPDATER_PUBLIC_KEY.Trim()
            )
            Set-Content -Path $path -Value $content
          }

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm tauri build ${{ matrix.args }}
        env:
          QUANTANOTE_TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.QUANTANOTE_TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.QUANTANOTE_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.QUANTANOTE_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build updater manifest
        shell: pwsh
        run: |
          $target = "${{ matrix.rust_target }}"
          if ([string]::IsNullOrWhiteSpace($target)) {
            $bundleRoot = "src-tauri/target/release/bundle"
          } else {
            $bundleRoot = "src-tauri/target/$target/release/bundle"
          }

          # Platform-specific: file filter, platform key, URL suffix
          $platformKey = ""
          $filter = ""
          $urlSuffix = ""

          switch ("${{ matrix.platform }}") {
            "windows-latest" {
              $platformKey = "windows-x86_64"
              $filter = "*.exe"
              $urlSuffix = ".exe"
            }
            "ubuntu-latest" {
              $platformKey = "linux-x86_64"
              $filter = "*.AppImage"
              $urlSuffix = ".AppImage"
            }
            default {
              # macOS
              $urlSuffix = ".tar.gz"
              $filter = "*.app.tar.gz"
              if ("${{ matrix.rust_target }}" -eq "aarch64-apple-darwin") {
                $platformKey = "darwin-aarch64"
              } else {
                $platformKey = "darwin-x86_64"
              }
            }
          }

          $artifact = Get-ChildItem -Path $bundleRoot -Recurse -Filter $filter |
            Select-Object -First 1
          if ($null -eq $artifact) { throw "$filter not found in $bundleRoot" }

          $sigPath = "$($artifact.FullName).sig"
          if (!(Test-Path $sigPath)) { throw "Signature file not found: $sigPath" }
          $signature = Get-Content $sigPath -Raw

          # Use the same renamed filename as "Prepare release assets" step
          $tag = $env:GITHUB_REF_NAME
          $renamedAsset = "QuantaNote-$tag-${{ matrix.artifact_name }}$urlSuffix"

          $version = $tag.TrimStart("v")
          $manifest = @{
            version = $version
            notes = "See GitHub release notes."
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              $platformKey = @{
                signature = $signature.Trim()
                url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$renamedAsset"
              }
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path (Join-Path $bundleRoot "latest-${{ matrix.artifact_name }}.json") -Value $manifest

      - name: Prepare release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "${{ github.ref_name }}"
          $platform = "${{ matrix.artifact_name }}"
          $target = "${{ matrix.rust_target }}"

          if ([string]::IsNullOrWhiteSpace($target)) {
            $bundleRoot = Join-Path $PWD "src-tauri/target/release/bundle"
          } else {
            $bundleRoot = Join-Path $PWD "src-tauri/target/$target/release/bundle"
          }

          if (!(Test-Path $bundleRoot)) {
            throw "Bundle directory not found: $bundleRoot"
          }

          $outDir = Join-Path $PWD "release-assets"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $suffixes = @(
            ".tar.gz.sig",
            ".tar.gz",
            ".AppImage.sig",
            ".AppImage",
            ".msi.sig",
            ".msi",
            ".exe.sig",
            ".exe",
            ".dmg.sig",
            ".dmg",
            ".deb.sig",
            ".deb",
            ".rpm.sig",
            ".rpm",
            ".zip.sig",
            ".zip"
          )

          $assets = Get-ChildItem -Path $bundleRoot -Recurse -File | Where-Object {
            $name = $_.Name
            $suffixes | Where-Object { $name.EndsWith($_, [System.StringComparison]::OrdinalIgnoreCase) }
          }

          if (!$assets) {
            throw "No bundle assets found in $bundleRoot"
          }

          foreach ($asset in $assets) {
            $suffix = $suffixes | Where-Object {
              $asset.Name.EndsWith($_, [System.StringComparison]::OrdinalIgnoreCase)
            } | Select-Object -First 1

            $destination = Join-Path $outDir "QuantaNote-$tag-$platform$suffix"
            Copy-Item -LiteralPath $asset.FullName -Destination $destination -Force
          }

          # Also copy per-platform updater manifest
          $manifestFile = Join-Path $bundleRoot "latest-$platform.json"
          if (Test-Path $manifestFile) {
            Copy-Item -LiteralPath $manifestFile -Destination (Join-Path $outDir "latest-$platform.json") -Force
          }

          Get-ChildItem -Path $outDir -File | ForEach-Object {
            Write-Host "Prepared release asset: $($_.Name)"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuantaNote-${{ github.ref_name }}-${{ matrix.artifact_name }}
          path: release-assets/*
          if-no-files-found: error

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} release-assets/* --clobber

  build-android:
    name: Build Android release
    needs: create-release
    uses: ./.github/workflows/build-android.yml
    secrets: inherit

  merge-updater-manifest:
    needs:
      - create-release
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Validate release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          $required = @(
            "QuantaNote-$tag-windows-x64.exe",
            "QuantaNote-$tag-windows-x64.msi",
            "QuantaNote-$tag-macos-aarch64.dmg",
            "QuantaNote-$tag-macos-x64.dmg",
            "QuantaNote-$tag-linux-x64.AppImage",
            "QuantaNote-$tag-linux-x64.deb",
            "QuantaNote-$tag-linux-x64.rpm",
            "QuantaNote-$tag-android-arm64-v8a.apk"
          )
          $available = Get-ChildItem -Path "all-artifacts" -Recurse -File | Select-Object -ExpandProperty Name
          foreach ($asset in $required) {
            if ($available -notcontains $asset) { throw "Missing release asset: $asset" }
          }

          $updaterAssets = @(
            "QuantaNote-$tag-windows-x64.exe.sig",
            "QuantaNote-$tag-linux-x64.AppImage.sig",
            "QuantaNote-$tag-macos-aarch64.tar.gz.sig",
            "QuantaNote-$tag-macos-x64.tar.gz.sig"
          )
          foreach ($asset in $updaterAssets) {
            if ($available -notcontains $asset) { throw "Missing updater signature: $asset" }
          }

      - name: Merge per-platform manifests into latest.json
        shell: pwsh
        run: |
          $manifestFiles = Get-ChildItem -Path "all-artifacts" -Recurse -Filter "latest-*.json"
          if ($manifestFiles.Count -eq 0) { throw "No latest-*.json manifests found" }

          $merged = $null
          foreach ($file in $manifestFiles) {
            $partial = Get-Content $file.FullName -Raw | ConvertFrom-Json
            if ($null -eq $merged) {
              $merged = $partial
            } else {
              # Merge platforms from this partial into the merged manifest
              foreach ($prop in $partial.platforms.PSObject.Properties) {
                $merged.platforms | Add-Member -MemberType NoteProperty -Name $prop.Name -Value $prop.Value -Force
              }
            }
          }

          $mergedJson = $merged | ConvertTo-Json -Depth 5
          $expectedVersion = $env:GITHUB_REF_NAME.TrimStart("v")
          if ($merged.version -ne $expectedVersion) {
            throw "Updater manifest version $($merged.version) != $expectedVersion"
          }
          $expectedPlatforms = @("windows-x86_64", "darwin-aarch64", "darwin-x86_64", "linux-x86_64")
          foreach ($platform in $expectedPlatforms) {
            $entry = $merged.platforms.PSObject.Properties[$platform]
            if ($null -eq $entry) { throw "Updater manifest missing platform: $platform" }
            if ([string]::IsNullOrWhiteSpace($entry.Value.signature)) { throw "Missing updater signature for $platform" }
            if ([string]::IsNullOrWhiteSpace($entry.Value.url)) { throw "Missing updater URL for $platform" }
          }
          Set-Content -Path "latest.json" -Value $mergedJson
          Write-Host "Merged manifest:`n$mergedJson"

      - name: Upload merged manifest to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} latest.json --clobber --repo ${{ github.repository }}

  publish-release:
    needs:
      - create-release
      - build
      - build-android
      - merge-updater-manifest
    runs-on: ubuntu-latest

    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number("${{ needs.create-release.outputs.release_id }}"),
              draft: false
            });

  build-cloud-image:
    name: Build and promote cloud image
    needs: publish-release
    uses: ./.github/workflows/build-cloud-image.yml
    secrets: inherit
