<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>QuantaNote</title>
    <script>
      (function() {
        var p = new URLSearchParams(window.location.search);
        var m = p.get('mode');
        if (m === 'floating-ball' || m === 'quick-note') {
          document.documentElement.classList.add(m === 'floating-ball' ? 'floating-ball-mode' : 'quick-note-mode');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
