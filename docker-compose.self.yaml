services:
    quantanote-cloud:
        image: ${QT_REGISTRY:-quantanote-cloud}
        build:
            context: ./quantanote-cloud
            dockerfile: Dockerfile
        ports:
            - "${SERVER__PORT:-3000}:3000"
        restart: unless-stopped
        volumes:
            - ./app/config:/app/config
            - ./app/data:/app/data
            - ./app/sync_data:/app/sync_data
        environment:
            ENV: ${ENV:-production}

            SERVER__HOST: "0.0.0.0"
            SERVER__PORT: ${SERVER__PORT:-3000}

            DATABASE__DATABASE_TYPE: ${DATABASE__DATABASE_TYPE:-sqlite}
            DATABASE__PATH: ${DATABASE__PATH:-/app/data/quantanote.db}

            AUTH__JWT_SECRET: ${AUTH__JWT_SECRET:?请设置 AUTH__JWT_SECRET}

            STORAGE__BACKEND_TYPE: ${STORAGE__BACKEND_TYPE:-local}
            STORAGE__BASE_PATH: ${STORAGE__BASE_PATH:-/app/sync_data}

            EMAIL__ENABLED: ${EMAIL__ENABLED:-true}
            EMAIL__SMTP_HOST: ${EMAIL__SMTP_HOST}
            EMAIL__SMTP_PORT: ${EMAIL__SMTP_PORT:-465}
            EMAIL__SMTP_USERNAME: ${EMAIL__SMTP_USERNAME}
            EMAIL__SMTP_PASSWORD: ${EMAIL__SMTP_PASSWORD}
            EMAIL__FROM_NAME: ${EMAIL__FROM_NAME:-QuantaNote}
            EMAIL__FROM_EMAIL: ${EMAIL__FROM_EMAIL}

volumes:
    cloud-config:
    cloud-data:
    cloud-sync:
