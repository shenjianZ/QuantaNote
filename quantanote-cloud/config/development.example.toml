# 开发环境配置 - SQLite 数据库
[server]
host = "0.0.0.0"
port = 3000

[database]
# 数据库类型: mysql, sqlite, postgresql
database_type = "sqlite"

# MySQL/PostgreSQL 配置
# host = "localhost"
# port = 3306
# user = "root"
# password = "root"
# database = "web_template"

# SQLite 配置（当 database_type = "sqlite" 时使用）
path = "data/app.db"

# 连接池配置
max_connections = 10

[auth]
jwt_secret = "CHANGE_ME_TO_A_STRONG_RANDOM_STRING"
# 分开配置两个 token 的过期时间
access_token_expiration_minutes = 15   # access_token 15 分钟
refresh_token_expiration_days = 7      # refresh_token 7 天

[redis]
host = "localhost"
port = 6379
password = ""  # 可选
db = 0

[storage]
# 存储后端类型: "local" | "s3" | "webdav"
backend_type = "local"

# 本地存储路径（backend_type = "local" 时使用）
base_path = "./sync_data"

# S3/MinIO 配置（backend_type = "s3" 时使用）
# bucket = "quantanote-sync"
# endpoint = "http://127.0.0.1:9000"
# region = "us-east-1"
# access_key = "minioadmin"
# secret_key = "minioadmin"

# WebDAV 配置（backend_type = "webdav" 时使用）
# webdav_url = "https://your-openlist.example.com/dav/QuantaNote"
# webdav_username = "your-username"
# webdav_password = "your-password"

[email]
enabled = false                      # 启用邮件服务（注册验证码、密码重置等）
# smtp_host = "smtp.example.com"
# smtp_port = 465
# smtp_username = ""
# smtp_password = ""
# from_name = "QuantaNote"
# from_email = ""
