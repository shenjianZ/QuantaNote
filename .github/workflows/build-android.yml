name: Build Android

on:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart("v")
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$').Matches[0].Groups[1].Value
          if ($packageVersion -ne $tagVersion) { throw "package.json version $packageVersion != tag $tagVersion" }
          if ($tauriVersion -ne $tagVersion) { throw "tauri.conf.json version $tauriVersion != tag $tagVersion" }
          if ($cargoVersion -ne $tagVersion) { throw "Cargo.toml version $cargoVersion != tag $tagVersion" }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Android signing
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $androidDir = "src-tauri/gen/android"
          $keystorePath = Join-Path $env:RUNNER_TEMP "keystore.jks"
          $keystorePropertiesPath = Join-Path $androidDir "app/keystore.properties"

          $requiredSecrets = @(
            "ANDROID_KEYSTORE_BASE64",
            "ANDROID_KEYSTORE_PASSWORD",
            "ANDROID_KEY_ALIAS",
            "ANDROID_KEY_PASSWORD"
          )
          foreach ($secretName in $requiredSecrets) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($secretName))) {
              throw "Missing required GitHub secret: $secretName"
            }
          }

          [IO.File]::WriteAllBytes(
            $keystorePath,
            [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          )

          @(
            "storeFile=$keystorePath"
            "storePassword=$env:ANDROID_KEYSTORE_PASSWORD"
            "keyAlias=$env:ANDROID_KEY_ALIAS"
            "keyPassword=$env:ANDROID_KEY_PASSWORD"
          ) | Set-Content -Path $keystorePropertiesPath -Encoding UTF8

      - name: Build APK
        run: pnpm tauri android build --apk --target aarch64 --split-per-abi --ci
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
          NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973

      - name: Prepare release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          $outDir = Join-Path $PWD "release-assets"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $androidRoot = Join-Path $PWD "src-tauri/gen/android"

          $apks = Get-ChildItem -Path $androidRoot -Recurse -Filter "*.apk" |
            Where-Object { $_.FullName -match "release" -and $_.FullName -notmatch "unaligned" -and $_.Name -match "arm64" }
          if ($apks.Count -ne 1) { throw "Expected exactly one ARM64 release APK in $androidRoot, found $($apks.Count)" }

          foreach ($apk in $apks) {
            $dest = Join-Path $outDir "QuantaNote-$tag-android-arm64-v8a.apk"
            Copy-Item -LiteralPath $apk.FullName -Destination $dest -Force
          }

          Get-ChildItem -Path $outDir -File | ForEach-Object {
            Write-Host "Prepared release asset: $($_.Name)"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuantaNote-${{ github.ref_name }}-android
          path: release-assets/*
          if-no-files-found: error

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} release-assets/* --clobber
